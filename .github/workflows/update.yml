name: 毎日の更新

on:
  schedule:
    - cron: "17 21 * * *" # 毎朝6:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/last_checked.txt", "data/raw/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: 市のサイトから議決結果を取得
        run: python scripts/fetch.py

      - name: 取得したページを保管（読み取りに失敗したときの調査用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages
          path: data/raw
          if-no-files-found: ignore
          retention-days: 14

      - name: 取得した内容を保存（60日ルール対策も兼ねる）
        run: |
          git config user.name "gikai-wakaru-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "データ更新 $(date +%F)"
          git push

  deploy:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: サイトを作成
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
